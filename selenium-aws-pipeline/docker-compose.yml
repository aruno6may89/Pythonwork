version: '3.8'

services:
  selenium:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    environment:
      - DISPLAY=:99
    ports:
      - "4444:4444"
    networks:
      - selenium-network

networks:
  selenium-network:
    driver: bridge