name: Run Selenium Tests on EC2

on:
  push:
    branches:
      - main  # Trigger on push to main branch

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Start EC2 instance
      run: |
        aws ec2 start-instances --instance-ids i-0ae50a368602b9b32 --region ${{ secrets.AWS_REGION }}
        echo "Waiting for EC2 to be ready..."
        sleep 60  # Optional: Replace with polling if needed

    - name: Setup SSH key
      run: |
        echo "${{ secrets.EC2_KEY }}" > key.pem
        chmod 400 key.pem

    - name: Run Selenium Tests on EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          cd ${{ secrets.EC2_REPO_DIR }}
          git pull origin main
          source venv/bin/activate
          pytest > test-output.log
          tail -n 50 test-output.log
        EOF

    - name: Upload Test Output
      if: always()
      run: |
        scp -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_REPO_DIR }}/test-output.log ./test-output.log

    - name: Upload test log to GitHub
      if: always()
      uses: actions/upload-artifact@v2
      with:
        name: selenium-test-output
        path: test-output.log
